<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحميل تيك توك بدون علامة مائية</title>
<style>
body{font-family:system-ui; background:#0f0f0f; color:white; text-align:center; margin:0; padding:15px;}
.box{background:#1a1a1a; max-width:500px; margin:30px auto; padding:25px; border-radius:20px; border:1px solid #333;}
h1{color:#fe2c55;}
input{width:90%; padding:15px; border-radius:12px; border:none; margin:15px 0; font-size:16px; text-align:center;}
button{background:#fe2c55; color:white; border:none; padding:15px 30px; border-radius:12px; font-size:18px; font-weight:bold; cursor:pointer; width:92%;}
#result{margin-top:20px; display:none;}
.dl{display:block; background:#25F4EE; color:black; text-decoration:none; padding:12px; border-radius:10px; margin-top:12px; font-weight:bold;}
.ad{background:#222; border:1px dashed #444; padding:12px; margin:15px 0; border-radius:10px; color:#888;}
</style>
</head>
<body>
<div class="ad">مكان اعلانك هون - بتحط كود ادسنس بعدين</div>
<div class="box">
<h1>تحميل تيك توك 🔥</h1>
<input type="text" id="url" placeholder="حط رابط التيك توك هون">
<button onclick="download()">تحميل الآن</button>
<div id="result">
<img id="thumb" style="width:100%; border-radius:15px; margin-top:15px;">
<h3 id="author"></h3>
<a id="dl1" class="dl" target="_blank">تحميل بدون علامة مائية</a>
<a id="dl2" class="dl" style="background:white;" target="_blank">تحميل الصوت MP3</a>
</div>
</div>
<div class="ad">مكان اعلان تاني</div>
<script>
async function download(){
let link=document.getElementById('url').value;
if(!link.includes('tiktok')){alert('حط رابط تيك توك صحيح');return;}
document.querySelector('button').innerText='عم حمّل...';
try{
let res=await fetch(`https://www.tikwm.com/api/?url=${link}`);
let data=await res.json();
if(data.data){
document.getElementById('result').style.display='block';
document.getElementById('thumb').src=data.data.cover;
document.getElementById('author').innerText='@'+data.data.author.unique_id;
document.getElementById('dl1').href=data.data.play;
document.getElementById('dl2').href=data.data.music;
}else{alert('جرب رابط تاني');}
}catch(e){alert('جرب بعد شوي');}
document.querySelector('button').innerText='تحميل الآن';
}
</script>
</body>
</html>
